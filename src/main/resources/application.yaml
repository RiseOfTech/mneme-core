spring:
  application:
    name: mneme-core
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mneme}
    username: ${DB_USERNAME:mneme}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  jwt:
    # The mneme-auth RSA public key (PEM), supplied by the environment or a mounted
    # file in every real environment. No real key material is committed here.
    public-key: ${JWT_PUBLIC_KEY:classpath:keys/mneme-auth-public.pem}
  leitner:
    intervals: [1d, 3d, 7d, 16d, 30d]
  cors:
    allowed-origins:
      - http://localhost:5173

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

---
spring:
  config:
    activate:
      on-profile: prod

app:
  cors:
    allowed-origins: []

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
