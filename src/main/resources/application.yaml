spring:
  application:
    name: mneme-core
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mneme}
    username: ${DB_USERNAME:mneme}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  auth:
    tokens:
      # Placeholder only — real tokens come from environment variables in every real
      # environment (Spring's relaxed binding: APP_AUTH_TOKENS_<KEY>). No real secret
      # is committed here.
      demo-token: 00000000-0000-0000-0000-000000000001
