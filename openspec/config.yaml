schema: spec-driven

context: |
  mneme-core — бэкенд Mneme: карточки, интервальное повторение по Лейтнеру, публичный REST API.
  Java 21, Spring Boot 4.1, PostgreSQL, Gradle (Kotlin DSL). MVP семейного масштаба.

  Перед написанием любого артефакта прочитай:
  - PROJECT.md: продуктовый объём и отвергнутые альтернативы. Раздел 6 перечисляет то, что не
    входит в объём MVP; не создавай этого и не возвращай отвергнутые альтернативы.
  - ARCHITECTURE.md: авторитетный дизайн.
  - CLAUDE.md: инженерные правила.

  Пиши все артефакты на русском. Генерация изображений, сервис mneme-ai, шаринг и продвинутые
  SRS относятся к Phase 2 и не должны появляться ни в одном артефакте. Идентификацией владеет
  mneme-auth; этот сервис только проверяет его токены.

  На английском остаются элементы, которые читают парсер и валидатор OpenSpec:
  - `## Purpose`, `## Requirements`, префикс `### Requirement:`;
  - `SHALL`, `MUST`, `MUST NOT` в тексте требований;
  - `#### Scenario:`, `**WHEN**`, `**THEN**`, `**AND**`;
  - `## Why`, `## What Changes`, `## Capabilities`, `### New Capabilities`,
    `### Modified Capabilities`, `## Impact` в proposal;
  - `## ADDED/MODIFIED/REMOVED/RENAMED Requirements` в дельтах;
  - id capability, строки `# <id> Specification`, имена директорий и файлов;
  - всё, что в обратных кавычках, и блоки кода: HTTP-статусы, значения `code`, пути, поля JSON,
    заголовки, имена классов и пакетов.

  Названия требований и сценариев пишутся на русском.

rules:
  specs:
    - Описывай только наблюдаемое поведение. Никаких имён классов, методов или библиотек.
    - Сценарии API указывают HTTP-статус, а для ошибок — машиночитаемый `code`.
    - Ресурс другого пользователя и отсутствующий ресурс неотличимы. Указывай это явно в любом
      сценарии, который читает или записывает ресурс, имеющий владельца.
  design:
    - Ссылайся на разделы ARCHITECTURE.md, а не пересказывай его.
    - Любое решение, которое отступает от ARCHITECTURE.md или расширяет его, идёт в раздел
      Decisions с обоснованием. Человек вносит его в ARCHITECTURE.md после архивации.
  tasks:
    - Порядок работы — domain, затем application, затем infrastructure, с тестами на каждом слое.
    - Не добавляй файл, тест или поведение, которых нет в tasks.md. Сообщи об этом и спроси.
    - Не правь ARCHITECTURE.md или PROJECT.md в рамках change, если человек явно не попросил.
    - Заверши задачей, которая запускает `./gradlew clean build`.
